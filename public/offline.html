<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão — Coliseu CRM</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        background: #21070f;
        color: #f7eff2;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { font-size: 1.5rem; margin: 0; font-weight: 700; }
      p { margin: 0; max-width: 30ch; font-size: 0.95rem; line-height: 1.5; color: #c4aeb7; }
      button {
        margin-top: 4px;
        border: 0;
        background: #8d173b;
        color: #fff;
        font: inherit;
        font-weight: 600;
        font-size: 0.95rem;
        min-height: 44px;
        padding: 10px 22px;
        border-radius: 10px;
        cursor: pointer;
      }
      button:hover { background: #6c1531; }
      button:focus-visible { outline: 2px solid #f08ca6; outline-offset: 2px; }
      button:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="Coliseu" />
    <h1>Você está offline</h1>
    <p>Não conseguimos carregar o Coliseu agora. Verifique sua conexão e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </body>
</html>
